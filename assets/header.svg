<svg xmlns="http://www.w3.org/2000/svg" width="840" height="230" viewBox="0 0 840 230" role="img" aria-label="anti-ghostsec: private software for people who'd rather not be watched">
<title>anti-ghostsec</title>
<defs>
  <linearGradient id="tb" x1="0" x2="1"><stop offset="0" stop-color="#000080"/><stop offset="1" stop-color="#1084d0"/></linearGradient>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#ffffff" opacity="0.035"/></pattern>
</defs>
<style>
.txt { font: 22px 'Courier New', 'DejaVu Sans Mono', monospace; fill: #33ff66; }
.prompt { font: 22px 'Courier New', 'DejaVu Sans Mono', monospace; fill: #c0c0c0; }
.cur { fill: #33ff66; animation: blink 1s steps(2, start) infinite; }
.title { font: bold 15px 'MS Sans Serif', Tahoma, 'DejaVu Sans', sans-serif; fill: #fff; }
.small { font: 13px Tahoma, 'DejaVu Sans', sans-serif; fill: #000; }
@keyframes blink { to { visibility: hidden; } }
.boot { animation: boot 1.2s ease-out both; }
@keyframes boot { from { opacity: 0; transform: scaleY(0.02); } 60% { opacity: 1; transform: scaleY(1.03); } to { transform: scaleY(1); } }
.glow { animation: glow 3s ease-in-out infinite; }
@keyframes glow { 50% { opacity: 0.55; } }

.m0 { animation: t0 20.0s infinite; }
@keyframes t0 {
  0% { width: 0; }
  0.000% { width: 0; animation-timing-function: steps(56, end); }
  11.250% { width: 739.2px; }
  21.250% { width: 739.2px; animation-timing-function: steps(12, end); }
  24.250% { width: 0; }
  100% { width: 0; }
}
.c0 { animation: k0 20.0s infinite; }
@keyframes k0 {
  0% { transform: translateX(0); opacity: 0; }
  0.000% { opacity: 0; }
  0.000% { transform: translateX(0); opacity: 1; animation-timing-function: steps(56, end); }
  11.250% { transform: translateX(739.2px); }
  21.250% { transform: translateX(739.2px); animation-timing-function: steps(12, end); }
  24.250% { transform: translateX(0); opacity: 1; }
  24.260% { opacity: 0; }
  100% { opacity: 0; }
}
.m1 { animation: t1 20.0s infinite; }
@keyframes t1 {
  0% { width: 0; }
  25.000% { width: 0; animation-timing-function: steps(47, end); }
  36.250% { width: 620.4px; }
  46.250% { width: 620.4px; animation-timing-function: steps(12, end); }
  49.250% { width: 0; }
  100% { width: 0; }
}
.c1 { animation: k1 20.0s infinite; }
@keyframes k1 {
  0% { transform: translateX(0); opacity: 0; }
  24.990% { opacity: 0; }
  25.000% { transform: translateX(0); opacity: 1; animation-timing-function: steps(47, end); }
  36.250% { transform: translateX(620.4px); }
  46.250% { transform: translateX(620.4px); animation-timing-function: steps(12, end); }
  49.250% { transform: translateX(0); opacity: 1; }
  49.260% { opacity: 0; }
  100% { opacity: 0; }
}
.m2 { animation: t2 20.0s infinite; }
@keyframes t2 {
  0% { width: 0; }
  50.000% { width: 0; animation-timing-function: steps(48, end); }
  61.250% { width: 633.6px; }
  71.250% { width: 633.6px; animation-timing-function: steps(12, end); }
  74.250% { width: 0; }
  100% { width: 0; }
}
.c2 { animation: k2 20.0s infinite; }
@keyframes k2 {
  0% { transform: translateX(0); opacity: 0; }
  49.990% { opacity: 0; }
  50.000% { transform: translateX(0); opacity: 1; animation-timing-function: steps(48, end); }
  61.250% { transform: translateX(633.6px); }
  71.250% { transform: translateX(633.6px); animation-timing-function: steps(12, end); }
  74.250% { transform: translateX(0); opacity: 1; }
  74.260% { opacity: 0; }
  100% { opacity: 0; }
}
.m3 { animation: t3 20.0s infinite; }
@keyframes t3 {
  0% { width: 0; }
  75.000% { width: 0; animation-timing-function: steps(28, end); }
  86.250% { width: 369.6px; }
  96.250% { width: 369.6px; animation-timing-function: steps(12, end); }
  99.250% { width: 0; }
  100% { width: 0; }
}
.c3 { animation: k3 20.0s infinite; }
@keyframes k3 {
  0% { transform: translateX(0); opacity: 0; }
  74.990% { opacity: 0; }
  75.000% { transform: translateX(0); opacity: 1; animation-timing-function: steps(28, end); }
  86.250% { transform: translateX(369.6px); }
  96.250% { transform: translateX(369.6px); animation-timing-function: steps(12, end); }
  99.250% { transform: translateX(0); opacity: 1; }
  99.260% { opacity: 0; }
  100% { opacity: 0; }
}
</style>
<!-- window -->
<rect x="0" y="0" width="840" height="230" fill="#c0c0c0"/>
<path d="M0 230V0H840" fill="none" stroke="#fff" stroke-width="2"/>
<path d="M0 229H839V0" fill="none" stroke="#000" stroke-width="2"/>
<path d="M2 227H837V2" fill="none" stroke="#808080" stroke-width="2"/>
<rect x="5" y="5" width="830" height="26" fill="url(#tb)"/>
<rect x="13" y="11" width="14" height="14" fill="#33ff66"/><rect x="16" y="14" width="8" height="8" fill="#000080"/>
<text x="36" y="23" class="title">anti-ghostsec.exe</text>
<g transform="translate(768,9)">
  <rect width="18" height="16" fill="#c0c0c0" stroke="#000"/><rect x="5" y="11" width="7" height="2" fill="#000"/>
  <rect x="21" width="18" height="16" fill="#c0c0c0" stroke="#000"/><rect x="25" y="3" width="10" height="9" fill="none" stroke="#000" stroke-width="2"/>
  <rect x="44" width="18" height="16" fill="#c0c0c0" stroke="#000"/><path d="M48 3l9 9M57 3l-9 9" stroke="#000" stroke-width="2"/>
</g>
<text x="12" y="50" class="small"><tspan text-decoration="underline">F</tspan>ile   <tspan text-decoration="underline">E</tspan>dit   <tspan text-decoration="underline">V</tspan>iew   <tspan text-decoration="underline">H</tspan>elp</text>
<!-- screen -->
<rect x="12" y="60" width="816" height="126" fill="#808080"/>
<rect x="14" y="62" width="814" height="124" fill="#fff"/>
<g class="boot" style="transform-origin: 420.0px 123.0px">
<rect x="14" y="62" width="812" height="122" fill="#000"/>
<rect x="14" y="62" width="812" height="122" fill="url(#scan)"/>
<text x="44" y="100" class="prompt">C:\ANTI-GHOSTSEC&gt; type README.TXT</text>

  <clipPath id="clip0"><rect class="m0" x="44" y="128" height="32" width="0"/></clipPath>
  <text x="44" y="150" clip-path="url(#clip0)" class="txt">Private software for people who'd rather not be watched.</text>
  <g class="c0" opacity="0"><rect class="cur" x="45" y="131" width="11.2" height="22"/></g>
  <clipPath id="clip1"><rect class="m1" x="44" y="128" height="32" width="0"/></clipPath>
  <text x="44" y="150" clip-path="url(#clip1)" class="txt">An operating system that looks like Windows 95.</text>
  <g class="c1" opacity="0"><rect class="cur" x="45" y="131" width="11.2" height="22"/></g>
  <clipPath id="clip2"><rect class="m2" x="44" y="128" height="32" width="0"/></clipPath>
  <text x="44" y="150" clip-path="url(#clip2)" class="txt">A browser, a messenger, an editor. No telemetry.</text>
  <g class="c2" opacity="0"><rect class="cur" x="45" y="131" width="11.2" height="22"/></g>
  <clipPath id="clip3"><rect class="m3" x="44" y="128" height="32" width="0"/></clipPath>
  <text x="44" y="150" clip-path="url(#clip3)" class="txt">Your computer works for you.</text>
  <g class="c3" opacity="0"><rect class="cur" x="45" y="131" width="11.2" height="22"/></g>
</g>
<!-- status bar -->
<rect x="12" y="196" width="816" height="22" fill="none" stroke="#808080"/>
<path d="M12 218H828V196" fill="none" stroke="#fff"/>
<circle cx="26" cy="207" r="5" fill="#33ff66" class="glow"/>
<text x="38" y="212" class="small">Online over Tor   ·   Telemetry: none   ·   Trackers blocked: all</text>
</svg>
